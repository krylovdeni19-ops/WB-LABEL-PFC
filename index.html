<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Генератор МХ и этикеток — автономный</title>
<style>
:root{--p:#a600a6;--d:#7b087f;--bg:#fbf7fc;--line:#eaddec;--muted:#76677c;--err:#b42318;--ok:#067647}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fbf7fc,#f8effa);color:#21152a;font:14px/1.45 Arial,sans-serif}
body:before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--d),#cb11ab,#e83eaf)}
.app{max-width:1050px;margin:auto;padding:24px}header{margin-bottom:22px}h1{font-size:26px;margin:0 0 5px}.sub,.hint{color:var(--muted);margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;margin:14px 0;box-shadow:0 5px 20px #7b087f12}
.block{border:1px solid #ead9ed;background:#fffafe;border-radius:10px;padding:12px;margin:10px 0}.blocktop{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
label{display:block;font-weight:bold;margin-bottom:5px}input{width:100%;border:1px solid #d8c5dc;border-radius:8px;padding:10px;font:inherit}
button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:bold;font:inherit}.primary{background:linear-gradient(135deg,var(--d),#cb11ab);color:white}.outline{background:#fff;border:1px solid #ddc4e1;color:var(--d)}.danger{background:#fff0f0;color:var(--err)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.summary{background:#fcf2fd;border:1px solid #ead1ed;color:#5d2c64;border-radius:9px;padding:11px;margin:12px 0}
.status{margin-top:10px;color:var(--muted)}.status.err{color:var(--err)}.status.ok{color:var(--ok)}
.tablebox{border:1px solid var(--line);border-radius:9px;overflow:auto;max-height:330px}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #f0e6f2}th{background:#fcf6fd}
@media(max-width:650px){.app{padding:14px}.grid{grid-template-columns:1fr 1fr}h1{font-size:22px}}
@media print{
 @page{size:100mm 20mm;margin:0}
 body{background:#fff;margin:0}.app,header,.card:not(#printArea){display:none!important}
 #printArea{display:block!important}.label{width:100mm;height:20mm;display:flex;align-items:center;gap:3mm;padding:1mm 2mm;page-break-after:always;break-after:page;overflow:hidden}
 .label:last-child{page-break-after:auto;break-after:auto}.label svg{width:18mm;height:18mm;flex:none}
 .label span{font:bold 10mm/1 Arial,sans-serif;white-space:nowrap;flex:1;text-align:center}
}
#printArea{display:none}
</style>
</head>
<body>
<main class="app">
<header><h1>Генератор мест хранения и этикеток</h1><p class="sub">Автономная версия: без базы данных, серверов и внешних библиотек.</p></header>
<section class="card">
<h2>Параметры мест хранения</h2>
<div id="blocks"></div>
<div class="actions"><button class="outline" id="addBlock">＋ Добавить блок</button></div>
<div class="summary" id="summary">Настройте блоки стеллажей.</div>
<div class="actions">
<button class="primary" id="generate">Создать МХ и этикетки</button>
<button class="outline" id="csv" disabled>Скачать список МХ (CSV)</button>
<button class="outline" id="print" disabled>Печать этикеток / Сохранить PDF</button>
</div>
<div class="status" id="status">Все вычисления выполняются локально в вашем браузере.</div>
</section>
<section class="card" id="result" hidden>
<h2>Созданные места хранения</h2><p class="hint" id="resultInfo"></p>
<div class="tablebox"><table><thead><tr><th>№</th><th>Адрес МХ</th></tr></thead><tbody id="rows"></tbody></table></div>
</section>
</main>
<div id="printArea"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),pad=(n,l=2)=>String(n).padStart(l,'0');
let blocks=[{from:1,to:1,shelves:1,cells:1}],values=[];
function blockHtml(b,i){return `<div class="block" data-i="${i}"><div class="blocktop"><b>Блок ${i+1}</b>${i?'<button type="button" class="danger del">Удалить</button>':''}</div><div class="grid">
<div><label>Стеллажи: с</label><input class="from" type="number" min="1" value="${b.from}"></div>
<div><label>Стеллажи: по</label><input class="to" type="number" min="1" value="${b.to}"></div>
<div><label>Полок</label><input class="shelves" type="number" min="1" value="${b.shelves}"></div>
<div><label>Ячеек на полке</label><input class="cells" type="number" min="1" value="${b.cells}"></div></div></div>`}
function render(){ $('blocks').innerHTML=blocks.map(blockHtml).join('');$('blocks').querySelectorAll('input').forEach(x=>x.addEventListener('input',summary));$('blocks').querySelectorAll('.del').forEach(x=>x.onclick=()=>{blocks.splice(+x.closest('.block').dataset.i,1);render();summary()});}
function getBlocks(){let a=[...$('blocks').querySelectorAll('.block')].map(e=>{const get=c=>{let v=Number(e.querySelector('.'+c).value);if(!Number.isInteger(v)||v<1)throw Error('Все параметры должны быть целыми числами не меньше 1.');return v};return{from:get('from'),to:get('to'),shelves:get('shelves'),cells:get('cells')}}).sort((a,b)=>a.from-b.from);let last=0;a.forEach(b=>{if(b.to<b.from)throw Error('Конец диапазона меньше начала.');if(b.from<=last)throw Error('Диапазоны стеллажей пересекаются.');last=b.to});return a}
function makeValues(){let out=[];getBlocks().forEach(b=>{for(let r=b.from;r<=b.to;r++)for(let s=1;s<=b.shelves;s++)for(let c=1;c<=b.cells;c++)out.push(`${pad(r)}.${pad(s)}.${pad(c)}`)});return out}
function summary(){try{let v=makeValues();$('summary').textContent=`Будет создано ${v.length.toLocaleString('ru-RU')} МХ: ${v[0]||'—'} — ${v.at(-1)||'—'}.`}catch(e){$('summary').textContent=e.message}}
function gfMul(x,y){let z=0;for(let i=0;i<8;i++){if(y&1)z^=x;y>>=1;x<<=1;if(x&256)x^=0x11d}return z}
function rs(data,n){let gen=[1],root=1;for(let i=0;i<n;i++){let next=Array(gen.length+1).fill(0);gen.forEach((v,j)=>{next[j]^=v;next[j+1]^=gfMul(v,root)});gen=next;root=gfMul(root,2)}let res=Array(n).fill(0);data.forEach(v=>{let k=v^res.shift();res.push(0);gen.slice(1).forEach((g,i)=>res[i]^=gfMul(g,k))});return res}
function qrSvg(text){
 const bytes=[...new TextEncoder().encode(text)];if(bytes.length>17)throw Error('Значение слишком длинное для автономного QR-кода: '+text);
 let bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
 put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));put(0,Math.min(4,152-bits.length));while(bits.length%8)bits.push(0);
 let data=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];data.push(v)}
 for(let p=0;data.length<19;p++)data.push(p%2?0x11:0xec);
 const code=data.concat(rs(data,7)),n=21,m=Array.from({length:n},()=>Array(n).fill(null));
 function finder(x,y){for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){let xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=n||yy>=n)continue;let on=dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));m[yy][xx]=on?1:0}}
 finder(0,0);finder(14,0);finder(0,14);
 for(let i=8;i<13;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
 // Reserve format-information cells
 for(let i=0;i<9;i++){if(i!==6){m[8][i]=0;m[i][8]=0}}
 for(let i=0;i<8;i++){m[8][20-i]=0;m[20-i][8]=0}m[8][13]=0;m[13][8]=0;m[13][8]=1;
 let bit=0,up=true;
 for(let x=20;x>=1;x-=2){if(x===6)x=5;for(let k=0;k<21;k++){let y=up?20-k:k;for(let dx=0;dx<2;dx++){let xx=x-dx;if(m[y][xx]!==null)continue;let b=bit<code.length*8?((code[bit>>>3]>>>(7-(bit&7)))&1):0;bit++;if((y+xx)%2===0)b^=1;m[y][xx]=b}}up=!up}
 // Format bits: error correction L (01), mask 000
 let d=8,rem=d;for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);let f=((d<<10)|rem)^0x5412;
 for(let i=0;i<15;i++){let b=(f>>>i)&1;
  if(i<6)m[i][8]=b;else if(i<8)m[i+1][8]=b;else m[20-14+i][8]=b;
  if(i<8)m[8][20-i]=b;else if(i<9)m[8][15-i]=b;else m[8][14-i]=b;
 }
 m[13][8]=1;
 let rects='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 23 23" shape-rendering="crispEdges"><rect x="-1" y="-1" width="23" height="23" fill="white"/> <g fill="black">${rects}</g></svg>`;
}
function arrowSvg(direction){const path=direction==='down'?'M12 24 L2 10 H9 V0 H15 V10 H22 Z':'M12 0 L22 14 H15 V24 H9 V14 H2 Z';return `<svg class="direction" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="${path}" fill="black"/></svg>`}
function generate(){try{values=makeValues();if(!values.length)throw Error('Нет мест хранения для создания.');$('rows').innerHTML=values.map((v,i)=>`<tr><td>${i+1}</td><td>${v}</td></tr>`).join('');$('resultInfo').textContent=`Создано ${values.length.toLocaleString('ru-RU')} уникальных адресов.`;$('result').hidden=false;
 $('printArea').innerHTML=values.map(v=>{const shelf=Number(v.split('.')[1]);const direction=shelf===5?'down':'up';return `<div class="label">${qrSvg(v)}${arrowSvg(direction)}<span>${v}</span></div>`}).join('');
 $('csv').disabled=false;$('print').disabled=false;$('status').className='status ok';$('status').textContent='МХ и QR-этикетки подготовлены. Данные никуда не отправлялись.';$('result').scrollIntoView({behavior:'smooth'});
 }catch(e){$('status').className='status err';$('status').textContent=e.message}}
$('addBlock').onclick=()=>{blocks.push({from:'',to:'',shelves:'',cells:''});render();summary()};
$('generate').onclick=generate;
$('csv').onclick=()=>{let csv='Адрес МХ\\r\\n'+values.map(v=>'"'+v+'"').join('\\r\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='места-хранения.csv';a.click();URL.revokeObjectURL(a.href)};
$('print').onclick=()=>window.print();
render();summary();
})();
</script>
</body></html>
